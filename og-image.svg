<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(63,185,80,0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="bearGlow" cx="35%" cy="50%" r="40%" fx="35%" fy="50%">
      <stop offset="0%" stop-color="rgba(63,185,80,0.12)"/>
      <stop offset="100%" stop-color="rgba(63,185,80,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Grid pattern -->
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Radial glow behind bear -->
  <rect x="0" y="0" width="440" height="630" fill="url(#bearGlow)"/>

  <!-- Bear face icon (favicon scaled ~8.5x, centered in left zone 0-420) -->
  <g transform="translate(52, 165) scale(8.5)">
    <!-- Left ear outer -->
    <circle cx="9" cy="9" r="5" fill="#3fb950"/>
    <!-- Right ear outer -->
    <circle cx="23" cy="9" r="5" fill="#3fb950"/>
    <!-- Left ear inner -->
    <circle cx="9" cy="9" r="2.8" fill="#2ea043"/>
    <!-- Right ear inner -->
    <circle cx="23" cy="9" r="2.8" fill="#2ea043"/>
    <!-- Head -->
    <circle cx="16" cy="18" r="11" fill="#3fb950"/>
    <!-- Snout -->
    <ellipse cx="16" cy="22" rx="5" ry="3.5" fill="#2ea043"/>
    <!-- Nose -->
    <ellipse cx="16" cy="20.5" rx="2.2" ry="1.4" fill="#0d1117"/>
    <!-- Left eye -->
    <circle cx="12" cy="16" r="1.6" fill="#0d1117"/>
    <!-- Right eye -->
    <circle cx="20" cy="16" r="1.6" fill="#0d1117"/>
    <!-- Left eye shine -->
    <circle cx="12.6" cy="15.4" r="0.5" fill="white"/>
    <!-- Right eye shine -->
    <circle cx="20.6" cy="15.4" r="0.5" fill="white"/>
  </g>

  <!-- Vertical separator -->
  <line x1="440" y1="80" x2="440" y2="550" stroke="#30363d" stroke-width="1"/>

  <!-- Right zone content -->

  <!-- Monospace tag text -->
  <text x="470" y="190" font-family="'Courier New', Courier, monospace" font-size="26" fill="#8b949e">&lt;BearAppTH /&gt;</text>

  <!-- Bold "Downloads" heading -->
  <text x="470" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="82" font-weight="700" fill="#e6edf3" letter-spacing="-2">Downloads</text>

  <!-- Subtitle -->
  <text x="470" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#8b949e">Free &amp; open-source Android apps</text>

  <!-- Green accent bar -->
  <rect x="470" y="415" width="72" height="5" rx="3" fill="#3fb950"/>

  <!-- App pill -->
  <rect x="470" y="450" width="270" height="52" rx="10" fill="rgba(63,185,80,0.12)" stroke="rgba(63,185,80,0.4)" stroke-width="1.5"/>
  <text x="484" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#3fb950">🐻  Bear MicroG</text>

  <!-- Footer URL -->
  <text x="470" y="572" font-family="'Courier New', Courier, monospace" font-size="20" fill="#484f58">bearappth.github.io</text>
</svg>
